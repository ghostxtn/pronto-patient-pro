

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      - MIGRATION_DB_PASSWORD=${MIGRATION_DB_PASSWORD}
      - AUDIT_DB_PASSWORD=${AUDIT_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      retries: 5
    networks:
      - clinic_network

  redis:
    image: redis:7-alpine
    container_name: clinic_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      retries: 5
    networks:
      - clinic_network

  api:
    build:
      context: ./backend
    container_name: clinic_api
    environment:
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUDIT_DATABASE_URL: postgresql://audit_user:${AUDIT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: production
      APP_ENV: production
      API_PORT: "3000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      FRONTEND_URL: http://test-klinik.localhost
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clinic_network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: clinic_nginx
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - clinic_network

networks:
  clinic_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
